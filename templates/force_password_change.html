{% extends "base.html" %}

{% block title %}Change Default Password — Paras Furniture{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
  <div class="col-md-6">
    <div class="card border-0 shadow-lg rounded-3">
      <div class="card-body p-4">
        <div class="text-center mb-4">
          <div class="d-inline-flex align-items-center justify-content-center bg-warning text-dark rounded-circle mb-3" style="width: 56px; height: 56px;">
            <svg class="icon-svg" style="width: 28px; height: 28px;" viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm-1 6h2v2h-2V7zm0 4h2v6h-2v-6z"/></svg>
          </div>
          <h3 class="fw-bold text-dark mb-1">Security Update Required</h3>
          <p class="text-muted small">You are logged in with the default password. For security, please choose a new custom password.</p>
        </div>

        <form method="POST" action="{{ url_for('auth.change_password_forced') }}">
          <div class="mb-3">
            <label for="new_password" class="form-label fw-bold">New Password</label>
            <input type="password" class="form-control form-control-lg" id="new_password" name="new_password" placeholder="Min 6 characters" required minlength="6">
          </div>

          <div class="mb-4">
            <label for="confirm_password" class="form-label fw-bold">Confirm New Password</label>
            <input type="password" class="form-control form-control-lg" id="confirm_password" name="confirm_password" placeholder="Re-enter new password" required minlength="6">
          </div>

          <button type="submit" class="btn btn-pf-accent btn-lg w-100 py-2 shadow-sm">
            Update Password & Continue
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
