{% extends "base.html" %}

{% block title %}Edit Expense — Paras Furniture{% endblock %}

{% block content %}
<div class="top-header">
  <div>
    <h4 class="fw-bold mb-0 text-dark">Edit Expense Record</h4>
    <small class="text-muted">Modify expense entry details</small>
  </div>
  <div>
    <a href="{{ url_for('expense.index') }}" class="btn btn-outline-secondary btn-sm">Cancel</a>
  </div>
</div>

<div class="row justify-content-center">
  <div class="col-md-8">
    <div class="card border-0 shadow-sm rounded-3">
      <div class="card-body p-4">
        <form method="POST" action="{{ url_for('expense.edit', expense_id=expense.id) }}">
          <div class="row g-3">
            <div class="col-md-6">
              <label for="expense_date" class="form-label fw-bold">Expense Date</label>
              <input type="date" class="form-control" id="expense_date" name="expense_date" value="{{ expense.expense_date.strftime('%Y-%m-%d') }}" required>
            </div>

            <div class="col-md-6">
              <label for="category_id" class="form-label fw-bold">Expense Category</label>
              <select class="form-select" id="category_id" name="category_id" required>
                {% for cat in categories %}
                  <option value="{{ cat.id }}" {% if expense.category_id == cat.id %}selected{% endif %}>{{ cat.name }} ({{ cat.default_type }})</option>
                {% endfor %}
              </select>
            </div>

            <div class="col-12">
              <label for="description" class="form-label fw-bold">Expense Description</label>
              <input type="text" class="form-control" id="description" name="description" value="{{ expense.description }}" required>
            </div>

            <div class="col-md-6">
              <label for="amount" class="form-label fw-bold">Amount (₹)</label>
              <input type="number" step="0.01" class="form-control form-control-lg fw-bold text-danger" id="amount" name="amount" value="{{ expense.amount }}" required>
            </div>

            <div class="col-md-6">
              <label for="payment_method" class="form-label fw-bold">Payment Method</label>
              <select class="form-select" id="payment_method" name="payment_method">
                {% for pm in ['Cash', 'UPI', 'Bank Transfer', 'Cheque', 'Card', 'Other'] %}
                  <option value="{{ pm }}" {% if expense.payment_method == pm %}selected{% endif %}>{{ pm }}</option>
                {% endfor %}
              </select>
            </div>

            <div class="col-md-6">
              <label for="vendor" class="form-label">Vendor / Person</label>
              <input type="text" class="form-control" id="vendor" name="vendor" value="{{ expense.vendor or '' }}">
            </div>

            <div class="col-md-6">
              <label for="receipt_number" class="form-label">Receipt Number</label>
              <input type="text" class="form-control" id="receipt_number" name="receipt_number" value="{{ expense.receipt_number or '' }}">
            </div>

            <div class="col-12 mt-4">
              <button type="submit" class="btn btn-pf-primary btn-lg w-100 py-2">Update Expense Record</button>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
