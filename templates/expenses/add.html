{% extends "base.html" %}

{% block title %}Add Expense — Paras Furniture{% endblock %}

{% block content %}
<div class="top-header">
  <div>
    <h4 class="fw-bold mb-0 text-dark">Add New Business Expense Entry</h4>
    <small class="text-muted">Record material, workshop, labour, office or business expenditure</small>
  </div>
  <div>
    <a href="{{ url_for('expense.index') }}" class="btn btn-outline-secondary btn-sm">Back to Expenses</a>
  </div>
</div>

<div class="row justify-content-center">
  <div class="col-md-8">
    <div class="card border-0 shadow-sm rounded-3">
      <div class="card-body p-4">
        <form method="POST" action="{{ url_for('expense.add') }}">
          <div class="row g-3">

            <div class="col-md-6">
              <label for="expense_date" class="form-label fw-bold">Expense Date <span class="text-danger">*</span></label>
              <input type="date" class="form-control" id="expense_date" name="expense_date" value="{{ today_date }}" required>
            </div>

            <div class="col-md-6">
              <label for="category_id" class="form-label fw-bold">Expense Category <span class="text-danger">*</span></label>
              <select class="form-select" id="category_id" name="category_id" required>
                <option value="">-- Select Expense Category --</option>
                {% for cat in categories %}
                  <option value="{{ cat.id }}">{{ cat.name }} ({{ cat.default_type }})</option>
                {% endfor %}
              </select>
            </div>

            <div class="col-12">
              <label for="description" class="form-label fw-bold">Expense Description <span class="text-danger">*</span></label>
              <input type="text" class="form-control" id="description" name="description" placeholder="e.g. Purchased 10 Plywood Sheets / Worker Daily Salary / Workshop Electricity Bill" required>
            </div>

            <div class="col-md-6">
              <label for="amount" class="form-label fw-bold">Amount (₹) <span class="text-danger">*</span></label>
              <div class="input-group">
                <span class="input-group-text bg-danger text-white fw-bold">₹</span>
                <input type="number" step="0.01" class="form-control form-control-lg fw-bold text-danger" id="amount" name="amount" placeholder="0.00" min="0.01" required>
              </div>
            </div>

            <div class="col-md-6">
              <label for="payment_method" class="form-label fw-bold">Payment Method</label>
              <select class="form-select" id="payment_method" name="payment_method">
                <option value="Cash" selected>Cash</option>
                <option value="UPI">UPI</option>
                <option value="Bank Transfer">Bank Transfer</option>
                <option value="Cheque">Cheque</option>
                <option value="Card">Card</option>
                <option value="Other">Other</option>
              </select>
            </div>

            <div class="col-md-6">
              <label for="vendor" class="form-label">Vendor / Payee Person Name</label>
              <input type="text" class="form-control" id="vendor" name="vendor" placeholder="e.g. Timber Mart / Ramesh Worker">
            </div>

            <div class="col-md-6">
              <label for="receipt_number" class="form-label">Receipt / Voucher Number</label>
              <input type="text" class="form-control" id="receipt_number" name="receipt_number" placeholder="e.g. REC-502">
            </div>

            <div class="col-md-6">
              <label for="location" class="form-label">Location / Site</label>
              <input type="text" class="form-control" id="location" name="location" value="Ahmedabad Workshop">
            </div>

            <div class="col-md-6 d-flex align-items-center mt-4">
              <div class="form-check form-switch">
                <input class="form-check-input" type="checkbox" id="recurring" name="recurring" value="1">
                <label class="form-check-label fw-semibold" for="recurring">Mark as Monthly Recurring Expense</label>
              </div>
            </div>

            <div class="col-12">
              <label for="notes" class="form-label">Additional Notes</label>
              <textarea class="form-control" id="notes" name="notes" rows="2" placeholder="Any extra comments..."></textarea>
            </div>

            <div class="col-12 mt-4">
              <button type="submit" class="btn btn-pf-accent btn-lg w-100 py-2 shadow-sm">
                Save Expense Record
              </button>
            </div>

          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
